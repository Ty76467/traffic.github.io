<!DOCTYPE html>
<html>
<head>
    <title>登录注册</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
 <!-- 全局错误提示 -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="global-error">
        <ul>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
    {% endwith %}

    <div class="box">
        <div class="forms">
            <!-- 登录/注册选项卡 -->
            <div class="tips">
                <span class="login-btn">登录</span>
                <span class="register-btn">注册</span>
            </div>

            <!-- 登录表单 -->
            <div class="login">
                <div class="form-title">
                    <h1>Hello</h1>
                    <h4>欢迎来到贵州市交通分析系统</h4>
                </div>
                <div class="form">
                    <form method="POST">
                        <div class="input-item username">
                            <input type="text" name="username" required>
                        </div>

                        <div class="input-item password">
                            <input type="password" name="password" required>
                        </div>
                        
                        <div class="form-buttons">
                            <button class="btn" type="submit">进入系统</button>
                            <span class="show-reset-btn">忘记密码？</span>
                        </div>
                       
                    </form>
                </div>
            </div>

            <!-- 注册表单 -->
            <div class="register">
                <div class="form-title">
                    <h1>注册</h1>
                    <h4>还没有账户？先填写下面信息吧</h4>
                </div>
                <div class="form">
                    <form action="/register" method="POST">
                        <div class="input-item username">
                            <input type="text" name="username" required>
                        </div>
                        <div class="input-item password">
                            <input type="password" name="password" required>
                        </div>
                        <button class="btn" type="submit">立即注册</button>
                    </form>
                </div>
            </div>

            <!-- 独立的重置密码表单 -->
            <div class="reset-pwd-form">
                <div class="form-title">
                    <h1>重置密码</h1>
                </div>
                <div class="form">
                    <form action="/reset_password" method="POST">
                        <div class="input-item username">
                            <input type="text" name="username"  required>
                        </div>
                        <div class="input-item password old-password">
                            <input type="password" name="old_password"placeholder="旧密码" required>
                        </div>
                        
                        <div class="input-item password new-password">
                            <input type="password" name="new_password"placeholder="新密码" required>
                        </div>
                        <div class="form-buttons">
                            <button class="btn" type="submit">重置密码</button>
                            <span class="back-login-btn">返回登录</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 选项卡切换逻辑
        const tabs = document.querySelectorAll('.tips span');
        const forms = document.querySelectorAll('.forms > div:not(.tips)');

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                // 移除所有激活状态
                tabs.forEach(t => t.classList.remove('login-btn'));
                forms.forEach(f => {
                    f.style.opacity = '0';
                    f.style.zIndex = '-1';
                });

                // 设置当前激活状态
                tab.classList.add('login-btn');
                forms[index].style.opacity = '1';
                forms[index].style.zIndex = '10';
            });
        });
        const showResetBtn = document.querySelector('.show-reset-btn');
        const backLoginBtn = document.querySelector('.back-login-btn');
        const resetForm = document.querySelector('.reset-pwd-form');

        // 显示重置密码表单
        showResetBtn.addEventListener('click', () => {
            resetForm.classList.add('active');
            document.querySelector('.login').style.opacity = '0';
        });

        // 返回登录表单
        backLoginBtn.addEventListener('click', () => {
            resetForm.classList.remove('active');
            document.querySelector('.login').style.opacity = '1';
        });
    </script>
</body>
</html>
